server:
  port: 0

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ewm
    username: root
    password: root
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always