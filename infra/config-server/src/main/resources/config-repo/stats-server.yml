server:
  port: 9090

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/stats
    username: root
    password: root
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always