server:
  port: 0

grpc:
  server:
    port: 0

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ewm?currentSchema=public
    username: root
    password: root
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: analyzer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.SpecificAvroDeserializer

kafka:
  topics:
    user-actions: stats.user-actions.v1
    events-similarity: stats.events-similarity.v1