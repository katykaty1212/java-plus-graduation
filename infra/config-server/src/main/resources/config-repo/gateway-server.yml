server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: stats-server
          uri: lb://stats-server
          predicates:
            - Path=/stats/**
        - id: main-service
          uri: lb://main-service
          predicates:
            - Path=/events/**,/users/**,/categories/**,/compilations/**,/admin/**