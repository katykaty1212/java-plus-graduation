server:
  port: 8097

eureka:
  instance:
    non-secure-port: 8097
    non-secure-port-enabled: true

spring:
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: aggregator
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: ru.practicum.ewm.stats.avro.UserActionAvroDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: ru.practicum.ewm.stats.avro.AvroSerializer

kafka:
  topics:
    user-actions: stats.user-actions.v1
    events-similarity: stats.events-similarity.v1