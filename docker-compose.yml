version: '3.8'
services:
  ewm-db:
    image: postgres:16-alpine
    container_name: ewm-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ewm
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d ewm"]
      interval: 2s
      timeout: 5s
      retries: 10

  stats-db:
    image: postgres:16-alpine
    container_name: stats-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: stats
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d stats"]
      interval: 2s
      timeout: 5s
      retries: 10